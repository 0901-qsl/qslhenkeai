    <style id="dynamicTheme">
        :root {
            --bg: #f5f5f7; --surface: #ffffff; --text-primary: #1a1a1a; --text-secondary: #6b6b7b; --text-tertiary: #999999;
            --bubble-mine: #1a1a1a; --bubble-mine-text: #ffffff; --bubble-partner: #e8e8ea; --bubble-partner-text: #1a1a1a;
            --border: #e0e0e4; --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --danger-hover: #dc2626;
            --call-bg: #1c1c1e; --transfer-bg: #fef9e7; --transfer-border: #f0c040;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.10); --shadow-lg: 0 12px 32px rgba(0,0,0,0.14);
            --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 24px; --topbar-height: 92px;
            --safe-bottom: env(safe-area-inset-bottom, 0px); --transition-fast: 0.18s ease; --transition-normal: 0.28s cubic-bezier(0.4,0,0.2,1);
            --fullpage-header-height: 52px; --avatar-radius: 50%; --bubble-radius-mine: 20px; --bubble-radius-partner: 20px;
            --chat-bg-image: none; --chat-bg-color: #f5f5f7; --msg-avatar-size: 36px;
            --msg-font-size: 15px;
            --spacing-xs: 6px; --spacing-sm: 10px; --spacing-md: 16px; --spacing-lg: 22px; --spacing-xl: 30px;
        }
        .dark-mode {
            --bg: #1a1a1a; --surface: #2c2c2e; --text-primary: #f5f5f7; --text-secondary: #a1a1a6; --text-tertiary: #6d6d72;
            --bubble-mine: #0a84ff; --bubble-mine-text: #ffffff; --bubble-partner: #3a3a3c; --bubble-partner-text: #f5f5f7;
            --border: #48484a; --accent: #0a84ff; --accent-hover: #409cff; --danger: #ff453a; --danger-hover: #ff6961;
            --call-bg: #1c1c1e; --transfer-bg: #2c2c1e; --transfer-border: #8e6b25;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.5); --shadow-lg: 0 12px 32px rgba(0,0,0,0.7);
            --chat-bg-color: #1a1a1a;
        }
        .dark-mode .msg-transfer-card,
        .dark-mode .transfer-detail-modal,
        .dark-mode .transfer-modal,
        .dark-mode .moment-post-inner,
        .dark-mode .group-select-popup-inner,
        .dark-mode .bubble-menu {
            color: #000000 !important;
        }
        .dark-mode .bubble-menu-btn {
            color: #000000 !important;
        }
        .dark-mode .msg-transfer-label { color: #8b6914 !important; }
        .dark-mode .msg-transfer-amount-wrap { border-bottom-color: #e67e22 !important; }
        .dark-mode .msg-transfer-amount { color: #5c3d00 !important; }
        .dark-mode .msg-transfer-note { color: #a08040 !important; }
        .dark-mode .msg-transfer-status.accepted { color: #2e7d32 !important; }
        .dark-mode .msg-transfer-status.rejected { color: #888 !important; }
        .dark-mode .msg-row.partner .msg-bubble { color: var(--bubble-partner-text) !important; }
        .dark-mode .msg-row.mine .msg-bubble { color: var(--bubble-mine-text) !important; }
        .dark-mode .bottombar-input { color: #000000 !important; }
        .dark-mode .bottombar-input::placeholder { color: #666666 !important; }
        .dark-mode input[type="text"],
        .dark-mode input[type="number"],
        .dark-mode textarea,
        .dark-mode .fp-textarea,
        .dark-mode .moment-comment-input,
        .dark-mode .fp-search-wrap input,
        .dark-mode .transfer-modal-input-row input,
        .dark-mode .transfer-modal-note-row input,
        .dark-mode .moment-post-textarea,
        .dark-mode .wcSearchInput {
            color: #000000 !important;
        }
        .dark-mode .msg-call-card { background: #2c2c2e; color: #f5f5f7; }
        .dark-mode .bubble-menu { background: #2c2c2e; }
        .dark-mode .bubble-menu-divider { background: #48484a; }
        .dark-mode .plus-panel { background: #2c2c2e; }
        .dark-mode .emoji-picker-panel { background: #2c2c2e; }
        .dark-mode .transfer-modal { background: #2c2c2e; }
        .dark-mode .transfer-detail-modal { background: #2c2c2e; }
        .dark-mode .group-select-popup-inner { background: #2c2c2e; }
        .dark-mode .moment-item { background: #2c2c2e; border-color: #48484a; color: #f5f5f7; }
        .dark-mode .moments-profile { background: #2c2c2e; color: #f5f5f7; }
        .dark-mode .moments-notification-bar { background: #2c2c2e; color: #f5f5f7; }
        .dark-mode .notification-item { background: #2c2c2e; border-color: #48484a; color: #f5f5f7; }
        .dark-mode .fp-card-item { background: #3a3a3c; color: #f5f5f7; }
        .dark-mode .fp-textarea, .dark-mode .moment-comment-input { background: #3a3a3c; color: #000000 !important; }
        .dark-mode .fp-search-wrap { background: #3a3a3c; }
        .dark-mode .settings-sidebar, .dark-mode .sidebar { background: #2c2c2e; color: #f5f5f7; }
        .dark-mode .fullpage-view { background: #2c2c2e; color: #f5f5f7; }
        .dark-mode .bottombar { background: #2c2c2e; }
        .dark-mode .topbar { background: #2c2c2e; }
        .dark-mode .bottombar-input-wrap { background: #3a3a3c; }
        .dark-mode .bottombar-plus-btn, .dark-mode .bottombar-voice-btn { background: #3a3a3c; }
        .dark-mode .chat-area { background-color: var(--chat-bg-color); }
        .dark-mode .typing-bubble { color: var(--text-secondary); }
        .dark-mode .quote-preview-bar { background: #3a3a3c; }
        .dark-mode .msg-date-separator { color: var(--text-tertiary); }
        .dark-mode .msg-system { color: var(--text-tertiary); }
        .dark-mode .moment-likes, .dark-mode .moment-comments { color: var(--text-secondary); }
        .dark-mode .moment-time, .dark-mode .notification-time { color: var(--text-tertiary); }
        .dark-mode .settings-section-title { color: var(--text-tertiary); }
        .dark-mode .fp-section-label { color: var(--text-tertiary); }
        .dark-mode .fp-stats { color: var(--text-secondary); }
        .dark-mode .fp-empty { color: var(--text-tertiary); }
        .dark-mode .fp-group-tag { background: #3a3a3c; color: var(--text-secondary); }
        .dark-mode .fp-group-tag.active { background: var(--accent); color: #fff; }
        .dark-mode .fp-btn-outline { background: #3a3a3c; color: var(--text-primary); }
        .dark-mode .settings-btn-sm { background: #3a3a3c; color: var(--text-primary); }
        .dark-mode .toggle-slider { background: #555; }
        .dark-mode .toggle-switch input:checked+.toggle-slider { background: var(--accent); }
        .dark-mode .fp-emoji-item { background: #3a3a3c; }
        .dark-mode .moment-comments { background: rgba(255,255,255,0.06); }

        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
        input,textarea{-webkit-user-select:text;user-select:text}
        html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:15px;line-height:1.5;color:var(--text-primary);background:var(--bg);position:fixed;top:0;left:0;right:0;bottom:0}
        .app-container{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
        @media(min-width:521px){.app-container{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
        .topbar{display:flex;align-items:center;justify-content:space-between;height:var(--topbar-height);padding:10px 14px 12px 10px;padding-top:calc(12px + env(safe-area-inset-top, 0px));background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;position:relative;gap:10px}
        .topbar-btn{width:44px;height:44px;border:none;background:transparent;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background var(--transition-fast);flex-shrink:0;outline:none}
        .topbar-btn:active{background:rgba(0,0,0,0.06)}.topbar-btn svg{width:24px;height:24px;color:var(--text-primary)}
        .topbar-partner-info{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;min-width:56px}
        .topbar-partner-avatar-wrap{width:42px;height:42px;border-radius:var(--avatar-radius);overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow-sm);flex-shrink:0;transition:transform var(--transition-fast),box-shadow var(--transition-fast),border-radius var(--transition-normal);cursor:pointer;background:#e0e0e4}
        .topbar-partner-avatar-wrap:active{transform:scale(0.92);box-shadow:var(--shadow-md)}
        .topbar-partner-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
        .topbar-partner-avatar-wrap svg{width:100%;height:100%;display:block;color:#b0b0b8}
        .topbar-partner-nickname{font-size:12px;font-weight:500;color:var(--text-primary);letter-spacing:0.03em;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;cursor:pointer;padding:2px 8px;border-radius:10px;transition:background var(--transition-fast)}
        .topbar-partner-nickname:active{background:rgba(0,0,0,0.06)}.topbar-spacer{flex:1;min-width:0}
        .chat-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background-color:var(--chat-bg-color);background-image:var(--chat-bg-image);background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:scroll;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;transition:background-image 0.5s ease;image-rendering:auto}
        .chat-area::-webkit-scrollbar{width:0;height:0}
        .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-tertiary);font-size:14px;padding:40px 20px;line-height:1.7}
        .chat-empty-inner svg{width:48px;height:48px;color:#c8c8d0;margin-bottom:16px}.chat-empty-inner p{margin:0}
        .msg-date-separator{text-align:center;font-size:12px;color:var(--text-tertiary);padding:8px 0;animation:msgIn 0.25s ease;}
        .msg-row{display:flex;align-items:flex-start;gap:10px;max-width:88%;animation:msgIn 0.32s cubic-bezier(0.22,0.61,0.36,1);position:relative}
        .msg-row.mine{align-self:flex-end;flex-direction:row-reverse}.msg-row.partner{align-self:flex-start;flex-direction:row}
        @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
        .msg-avatar{width:var(--msg-avatar-size);height:var(--msg-avatar-size);border-radius:var(--avatar-radius);overflow:hidden;flex-shrink:0;cursor:pointer;background:#e0e0e4;border:1.5px solid #fff;box-shadow:var(--shadow-sm);transition:transform var(--transition-fast),border-radius var(--transition-normal);align-self:flex-start;margin-top:4px}
        .msg-avatar:active{transform:scale(0.9)}.msg-avatar img{width:100%;height:100%;object-fit:cover;display:block}.msg-avatar svg{width:100%;height:100%;display:block;color:#b0b0b8}
        .msg-content{display:flex;flex-direction:column;gap:3px;min-width:0}.msg-row.mine .msg-content{align-items:flex-end}.msg-row.partner .msg-content{align-items:flex-start}
        .msg-nickname{font-size:11px;color:var(--text-tertiary);letter-spacing:0.02em;padding:0 5px;line-height:1.3;cursor:pointer;transition:color var(--transition-fast)}
        .msg-nickname:active{color:var(--accent)}
        .msg-bubble{padding:10px 14px;font-size:var(--msg-font-size);line-height:1.5;word-break:break-word;letter-spacing:0.01em;display:inline-block;max-width:100%;transition:border-radius var(--transition-normal),background var(--transition-normal),color var(--transition-normal),font-size var(--transition-fast);cursor:pointer;position:relative}
        .msg-bubble:active{opacity:0.85}
        .msg-row.mine .msg-bubble{background:var(--bubble-mine);color:var(--bubble-mine-text);border-radius:var(--bubble-radius-mine);border-top-right-radius:max(4px,calc(var(--bubble-radius-mine)*0.35))}
        .msg-row.partner .msg-bubble{background:var(--bubble-partner);color:var(--bubble-partner-text);border-radius:var(--bubble-radius-partner);border-top-left-radius:max(4px,calc(var(--bubble-radius-partner)*0.35))}
        .msg-image{max-width:160px;max-height:160px;border-radius:10px;object-fit:contain;display:block;cursor:pointer;margin-top:4px}
        .msg-audio{display:flex;align-items:center;gap:10px;padding:0;min-width:0;cursor:pointer;}
        .msg-audio-play{width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,0.12);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--transition-fast);}
        .msg-row.mine .msg-audio-play{background:rgba(255,255,255,0.18);}
        .msg-row.partner .msg-audio-play{background:rgba(0,0,0,0.10);}
        .msg-audio-play:active{opacity:0.7;}
        .msg-audio-play svg{width:14px;height:14px;}
        .msg-row.mine .msg-audio-play svg{color:#fff;}
        .msg-row.partner .msg-audio-play svg{color:var(--text-primary);}
        .msg-audio-wave{flex:1;display:flex;align-items:center;gap:2px;height:24px;}
        .msg-audio-wave span{flex:1;background:currentColor;border-radius:2px;min-width:2px;animation:none;opacity:0.5;}
        .msg-row.mine .msg-audio-wave span{background:rgba(255,255,255,0.7);}
        .msg-row.partner .msg-audio-wave span{background:rgba(0,0,0,0.3);}
        .msg-audio-dur{font-size:11px;opacity:0.7;flex-shrink:0;min-width:30px;text-align:right;}
        .msg-row.mine .msg-audio-dur{color:rgba(255,255,255,0.8);}
        .msg-row.partner .msg-audio-dur{color:var(--text-secondary);}
        .msg-time{font-size:10px;color:var(--text-tertiary);margin-top:2px;padding:0 5px;letter-spacing:0.02em;opacity:0.8}
        .msg-read-status{font-size:10px;color:var(--accent);margin-top:3px;padding:0 5px;text-align:right;font-weight:500;}
        .msg-quote{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;background:rgba(0,0,0,0.04);border-radius:5px;margin-bottom:4px;font-size:12px;max-width:220px;overflow:hidden;}
        .msg-row.mine .msg-quote{background:rgba(255,255,255,0.07);}
        .msg-row.partner .msg-quote{background:rgba(0,0,0,0.04);}
        .msg-quote-icon{width:14px;height:14px;flex-shrink:0;color:var(--text-tertiary);margin-top:1px;}
        .msg-quote-icon svg{width:14px;height:14px;display:block;}
        .msg-quote-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary);line-height:1.4;}
        .msg-quote-img{max-width:160px;max-height:160px;border-radius:6px;object-fit:contain;display:block;cursor:pointer;margin:2px 0;}
        .msg-system{text-align:center;font-size:12px;color:var(--text-tertiary);padding:6px 0;animation:msgIn 0.25s ease;}
        .msg-transfer-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px 14px;position:relative;overflow:visible;box-sizing:border-box;background-color:transparent;background-image:linear-gradient(0deg,rgba(255,255,255,1),rgba(255,255,255,1));box-shadow:0px 0px 0px rgba(0,0,0,0.18);color:#444444;line-height:1.55;letter-spacing:0.02em;word-break:break-word;z-index:10;border:0px solid transparent;outline:0px solid rgba(207,207,207,1);outline-offset:0px;cursor:pointer;min-width:180px;transition:all var(--transition-fast);border-radius:0px;}
        .msg-transfer-card:active{transform:scale(0.97)}
        .msg-transfer-label{font-size:13px;color:#8b6914;font-weight:500;text-align:left;}
        .msg-transfer-amount-wrap{display:flex;flex-direction:column;align-items:flex-start;width:100%;border-bottom:2px solid #e67e22;padding-bottom:5px;margin-bottom:3px;}
        .msg-transfer-amount{font-size:18px;font-weight:700;color:#5c3d00;letter-spacing:0.03em;text-align:left;}
        .msg-transfer-note{font-size:10px;color:#a08040;letter-spacing:0.02em;text-align:left;}
        .msg-transfer-status{font-size:11px;margin-top:3px;font-weight:500;text-align:left;}
        .msg-transfer-status.accepted{color:#2e7d32}.msg-transfer-status.rejected{color:#888}
        .msg-call-card{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f5f5f7;border-radius:20px;cursor:pointer;min-width:120px}
        .msg-call-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .msg-call-icon.missed{background:var(--danger)}.msg-call-icon.answered{background:#4caf50}.msg-call-icon.cancelled{background:#8e8e93}
        .msg-call-icon svg{width:14px;height:14px;color:#fff}.msg-call-text{font-size:13px;letter-spacing:0.02em}.msg-call-status{font-size:11px;opacity:0.8}
        .typing-indicator{align-self:flex-start;display:flex;align-items:center;gap:0;animation:msgIn 0.25s ease;padding-left:4px;margin-left:0}
        .typing-bubble{display:flex;align-items:center;gap:8px;padding:4px 2px;background:transparent;border-radius:0;font-size:13px;color:var(--text-secondary);letter-spacing:0.02em}
        .typing-dots{display:flex;gap:5px;align-items:center}
        .typing-dots span{width:6px;height:6px;border-radius:50%;background:#a0a0a8;animation:typingBounce 1.3s infinite ease-in-out}
        .typing-dots span:nth-child(1){animation-delay:0s}.typing-dots span:nth-child(2){animation-delay:0.18s}.typing-dots span:nth-child(3){animation-delay:0.36s}
        @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-8px);opacity:1}}
        .bubble-menu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.18);z-index:150;display:flex;overflow:hidden;animation:menuIn 0.15s ease;}
        @keyframes menuIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
        .bubble-menu-btn{flex:1;padding:12px 18px;font-size:14px;border:none;background:transparent;cursor:pointer;white-space:nowrap;color:var(--text-primary);transition:background var(--transition-fast);display:flex;align-items:center;justify-content:center;gap:8px;}
        .bubble-menu-btn:active{background:#f0f0f3;}
        .bubble-menu-btn.danger{color:var(--danger);}
        .bubble-menu-divider{width:1px;background:var(--border);}
        .quote-preview-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 10px 8px 10px;background:#f0f0f3;border-radius:10px;font-size:13px;color:var(--text-secondary);animation:menuIn 0.15s ease;}
        .quote-preview-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);}
        .quote-preview-close{width:24px;height:24px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);flex-shrink:0;}
        .quote-preview-close:active{background:rgba(0,0,0,0.08);}
        .quote-preview-close svg{width:14px;height:14px;}
        .voice-record-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:0 10px 8px 10px;background:#fff;border-radius:14px;font-size:13px;color:var(--text-primary);animation:menuIn 0.15s ease;box-shadow:var(--shadow-md);border:1.5px solid #fecaca;}
        .voice-record-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:voicePulse 0.8s infinite ease-in-out;}
        @keyframes voicePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.6);}}
        .voice-record-timer{flex:1;font-size:14px;font-weight:600;letter-spacing:0.03em;color:var(--danger);}
        .voice-record-cancel{width:30px;height:30px;border-radius:50%;border:none;background:#f5f5f7;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-tertiary);}
        .voice-record-cancel:active{background:#e0e0e4;}
        .voice-record-cancel svg{width:14px;height:14px;}
        .voice-record-stop{width:34px;height:34px;border-radius:50%;border:none;background:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(239,68,68,0.3);}
        .voice-record-stop:active{background:var(--danger-hover);transform:scale(0.92);}
        .voice-record-stop svg{width:16px;height:16px;color:#fff;}

            function formatDateHeader(ts) {
                const date = new Date(ts);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(today.getDate() - 1);
                if (date.toDateString() === today.toDateString()) return '今天';
                if (date.toDateString() === yesterday.toDateString()) return '昨天';
                const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekday = weekdays[date.getDay()];
                return `${month}月${day}日 ${weekday}`;
            }
            function formatMomentTime(ts) {

                if (date.toDateString() === now.toDateString()) {
                    return timeStr;
                }
                const yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);
                if (date.toDateString() === yesterday.toDateString()) {
                    return '昨天 ' + timeStr;

                const month = date.getMonth() + 1;
                const day = date.getDate();

            function openFullPage(pageKey) { if (sidebarOpen) closeSidebar(); if (settingsSidebarOpen) closeSettingsSidebar(); if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); const pageMap = { wordCards: document.getElementById('pageWordCards'), moments: document.getElementById('pageMoments'), nudge: document.getElementById('pageNudge'), puzzle: document.getElementById('pagePuzzle'), emoji: document.getElementById('pageEmoji'), beauty: document.getElementById('pageBeauty'), favorites: document.getElementById('pageFavorites'), storage: document.getElementById('pageStorage') }; const pageEl = pageMap[pageKey]; if (!pageEl || currentFullPage === pageKey) return; if (currentFullPage) { const prev = pageMap[currentFullPage]; if (prev) prev.classList.remove('active'); } pageEl.classList.add('active'); currentFullPage = pageKey; if (pageKey === 'wordCards') { wcFilterGroup = ''; wcSearchText = ''; renderWordCardsUI(); } if (pageKey === 'moments') renderMomentsPage(); if (pageKey === 'nudge') renderNudgePage(); if (pageKey === 'emoji') { currentEmojiTab = 'myEmoji'; document.querySelectorAll('#emojiTabs .fp-tab').forEach(t => t.classList.remove('active')); const tabEl = document.querySelector('#emojiTabs .fp-tab[data-tab="myEmoji"]'); if (tabEl) tabEl.classList.add('active'); renderEmojiTab('myEmoji'); } if (pageKey === 'beauty') renderBeautyPage(); if (pageKey === 'favorites') renderFavoritesPage(); if (pageKey === 'storage') renderStoragePage(); }
            function closeFullPage() { if (currentFullPage) { const pageMap = { wordCards: document.getElementById('pageWordCards'), moments: document.getElementById('pageMoments'), nudge: document.getElementById('pageNudge'), puzzle: document.getElementById('pagePuzzle'), emoji: document.getElementById('pageEmoji'), beauty: document.getElementById('pageBeauty'), favorites: document.getElementById('pageFavorites'), storage: document.getElementById('pageStorage') }; const pageEl = pageMap[currentFullPage]; if (pageEl) pageEl.classList.remove('active'); currentFullPage = null; } }
            function openPlusPanel() { if (sidebarOpen) closeSidebar(); if (settingsSidebarOpen) closeSettingsSidebar(); if (emojiPickerOpen) closeEmojiPicker(); plusPanelOpen = true; plusPanel.classList.add('active'); btnPlus.classList.add('active'); inputMsg.blur(); }
            function closePlusPanel() { plusPanelOpen = false; plusPanel.classList.remove('active'); btnPlus.classList.remove('active'); }
            function togglePlusPanel() { if (plusPanelOpen) closePlusPanel(); else openPlusPanel(); }
            function openEmojiPicker() { closePlusPanel(); emojiPickerOpen = true; emojiPickerPanel.classList.add('active'); renderEmojiPickerGrid(); }
            function closeEmojiPicker() { emojiPickerOpen = false; emojiPickerPanel.classList.remove('active'); }
            function renderEmojiPickerGrid() { emojiPickerGrid.innerHTML = ''; if (!myEmojis.length) { emojiPickerGrid.innerHTML = '<div class="emoji-picker-empty">暂无表情包</div>'; return; } myEmojis.forEach(data => { const item = document.createElement('div'); item.className = 'emoji-picker-item'; item.innerHTML = '<img src="' + data + '"/>'; item.addEventListener('click', () => { closeEmojiPicker(); sendMessage(null, data); }); emojiPickerGrid.appendChild(item); }); }
            function openTransferModal() { closePlusPanel(); transferAmount.value = ''; transferNote.value = ''; transferTargetName.textContent = partnerNickname || '对方'; transferModalOverlay.classList.add('active'); setTimeout(() => transferAmount.focus(), 300); }
            function closeTransferModal() { transferModalOverlay.classList.remove('active'); }
            function handlePhotoSelect() { closePlusPanel(); fileInputPhoto.click(); fileInputPhoto.onchange = () => { const file = fileInputPhoto.files[0]; if (!file) return; compressImage(file, 800, 800, 0.8, (base64) => { sendMessage(null, base64); showToast('已发送'); }); fileInputPhoto.value = ''; }; }
            function openSidebar() { sidebarOpen = true; sidebar.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; updateSidebarMomentsBadge(); }
            function closeSidebar() { sidebarOpen = false; sidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
            function openSettingsSidebar() { settingsSidebarOpen = true; settingsSidebar.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; renderSettingsBody(); }
            function closeSettingsSidebar() { settingsSidebarOpen = false; settingsSidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
            function showToast(msg) { if (toastTimer) clearTimeout(toastTimer); toast.textContent = msg; toast.classList.add('show'); toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, 1800); }
            function setupViewportHandler() { const visualViewport = window.visualViewport; if (visualViewport) { const updateHeight = () => { appContainer.style.height = visualViewport.height + 'px'; document.body.style.height = visualViewport.height + 'px'; window.scrollTo(0, 0); }; visualViewport.addEventListener('resize', updateHeight); visualViewport.addEventListener('scroll', updateHeight); updateHeight(); } }
            function setupEventListeners() { btnSend.addEventListener('click', () => { if (!btnSend.disabled) sendMessage(inputMsg.value.trim()); }); inputMsg.addEventListener('input', () => { updateSendButton(); autoResizeInput(); }); inputMsg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!btnSend.disabled) sendMessage(inputMsg.value.trim()); } }); inputMsg.addEventListener('focus', () => { if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); setTimeout(() => scrollChatToBottom(true), 300); window.scrollTo(0,0); }); btnVoice.addEventListener('click', (e) => { e.stopPropagation(); if (btnVoice.classList.contains('recording')) { stopRecording(true); } else { if (mediaRecorder && mediaRecorder.state !== 'inactive') return; if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); startRecording(); } }); btnSidebar.addEventListener('click', () => { if (settingsSidebarOpen) closeSettingsSidebar(); if (currentFullPage) closeFullPage(); if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); openSidebar(); }); btnSidebarClose.addEventListener('click', closeSidebar); overlay.addEventListener('click', () => { if (sidebarOpen) closeSidebar(); if (settingsSidebarOpen) closeSettingsSidebar(); }); btnSettings.addEventListener('click', () => { if (sidebarOpen) closeSidebar(); if (currentFullPage) closeFullPage(); if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); if (settingsSidebarOpen) closeSettingsSidebar(); else openSettingsSidebar(); }); btnSettingsClose.addEventListener('click', closeSettingsSidebar); document.querySelectorAll('.sidebar-menu-item[data-page]').forEach(item => { item.addEventListener('click', () => { const pageKey = item.dataset.page; if (pageKey) openFullPage(pageKey); }); }); document.querySelectorAll('.fullpage-back').forEach(btn => { btn.addEventListener('click', closeFullPage); }); avatarPartnerTop.addEventListener('click', (e) => { e.stopPropagation(); handleAvatarSelect(fileInputPartner, 'partner'); }); partnerNicknameTop.addEventListener('click', (e) => { e.stopPropagation(); editPartnerNickname(); }); const emojiTabs = document.getElementById('emojiTabs'); if (emojiTabs) { emojiTabs.addEventListener('click', (e) => { if (e.target.classList.contains('fp-tab')) { const tab = e.target.dataset.tab; document.querySelectorAll('#emojiTabs .fp-tab').forEach(t => t.classList.remove('active')); e.target.classList.add('active'); renderEmojiTab(tab); } }); } sidebar.addEventListener('click', (e) => e.stopPropagation()); settingsSidebar.addEventListener('click', (e) => e.stopPropagation()); document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (momentsNotificationOverlay.classList.contains('active')) momentsNotificationOverlay.classList.remove('active'); else if (imagePreviewOverlay.classList.contains('active')) closeImagePreview(); else if (currentFullPage) closeFullPage(); else if (sidebarOpen) closeSidebar(); else if (settingsSidebarOpen) closeSettingsSidebar(); else if (plusPanelOpen) closePlusPanel(); else if (emojiPickerOpen) closeEmojiPicker(); else { hideBubbleMenu(); hideNudgeTriggerMenu(); hideNudgeMenu(); } } }); document.addEventListener('pointerdown', (e) => { if (activeBubbleMenu && !activeBubbleMenu.contains(e.target) && !e.target.closest('.msg-bubble, .msg-image, .msg-audio')) { hideBubbleMenu(); } if (activeNudgeTriggerMenu && !activeNudgeTriggerMenu.contains(e.target) && !e.target.closest('.msg-avatar')) { hideNudgeTriggerMenu(); } if (activeNudgeMenu && !activeNudgeMenu.contains(e.target) && !e.target.closest('.msg-avatar')) { hideNudgeMenu(); } }); btnPlus.addEventListener('click', (e) => { e.stopPropagation(); togglePlusPanel(); }); plusPanel.addEventListener('click', (e) => e.stopPropagation()); document.querySelectorAll('.plus-panel-item').forEach(item => { item.addEventListener('click', () => { const action = item.dataset.action; if (action === 'emoji') openEmojiPicker(); else if (action === 'photo') handlePhotoSelect(); else if (action === 'video_call') startOutgoingCall(); else if (action === 'transfer') openTransferModal(); }); }); emojiPickerPanel.addEventListener('click', (e) => e.stopPropagation()); emojiPickerBack.addEventListener('click', () => { closeEmojiPicker(); openPlusPanel(); }); transferModalOverlay.addEventListener('click', (e) => { if (e.target === transferModalOverlay) closeTransferModal(); }); transferCancel.addEventListener('click', closeTransferModal); transferConfirm.addEventListener('click', confirmTransfer); transferAmount.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmTransfer(); }); chatArea.addEventListener('click', (e) => { if (!e.target.closest('.msg-bubble, .msg-image, .msg-audio')) { hideBubbleMenu(); } if (!e.target.closest('.msg-avatar')) { hideNudgeTriggerMenu(); hideNudgeMenu(); } if (plusPanelOpen) closePlusPanel(); if (emojiPickerOpen) closeEmojiPicker(); }); updateSendButton(); autoResizeInput(); }
            init();
        })();
    </script>
</body>
</html>
